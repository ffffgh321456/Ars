# Netlify: публикация статического сайта вместе с функциями онлайн-поиска.
# Папка проекта публикуется целиком, функции лежат в netlify/functions.
# После деплоя адреса /api/heroes и /api/hero работают так же, как на локальном сервере.

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/lib/**"]

# Клиент всегда запрашивает /api/heroes?q=... и /api/hero?id=...
# Редирект status = 200 отдаёт ответ функции, не меняя адрес в браузере.
[[redirects]]
  from = "/api/heroes"
  to = "/.netlify/functions/heroes"
  status = 200
  force = true

[[redirects]]
  from = "/api/hero"
  to = "/.netlify/functions/hero"
  status = 200
  force = true
